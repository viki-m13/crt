name: Edge3 independent inverse-contract history
on:
  push:
    branches: [research/edge3-20260909]
    paths: [.github/workflows/edge3-public-inverse.yml]
permissions:
  contents: read
jobs:
  public_history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pandas==2.3.3 pyarrow==21.0.0 requests==2.32.5
      - name: Public historical data only; stop if access denied
        run: |
          mkdir -p inverse-history
          python - <<'PY'
          import requests,time,json,hashlib,pathlib
          import pandas as pd
          root=pathlib.Path('inverse-history');manifest=[];state={'status':'started','venue':'BitMEX public historical market data; NOT authorization for US persons to use trading services.'}
          sess=requests.Session();sess.headers['User-Agent']='CRT historical research contact viktormashalov@gmail.com'
          def get(path,params):
              time.sleep(1.25)
              r=sess.get('https://www.bitmex.com/api/v1/'+path,params=params,timeout=50)
              if r.status_code in (403,429,451):raise PermissionError(f'Access restricted {r.status_code}; stopping this venue')
              r.raise_for_status();manifest.append({'url':r.url,'sha256':hashlib.sha256(r.content).hexdigest()});return r.json()
          try:
              specs=get('instrument',{'symbol':'XBTUSD','count':1})
              (root/'current_instrument_specs.json').write_text(json.dumps(specs,indent=2))
              for typ in ('funding','trade/bucketed'):
                  rows=[];cursor=pd.Timestamp('2021-01-01T00:00:00Z');end=pd.Timestamp('2026-01-01T00:00:00Z')
                  while cursor<=end:
                      params={'symbol':'XBTUSD','startTime':cursor.isoformat(),'endTime':end.isoformat(),'count':1000,'reverse':'false'}
                      if typ=='trade/bucketed':params.update(binSize='1h',partial='false')
                      chunk=get(typ,params)
                      if not isinstance(chunk,list):raise ValueError('expected historical list')
                      if not chunk:break
                      rows.extend(chunk);nxt=pd.to_datetime(chunk[-1]['timestamp'],utc=True)+pd.Timedelta(milliseconds=1)
                      if nxt<=cursor:raise ValueError('pagination did not advance')
                      cursor=nxt
                      if len(rows)%5000<1000:print(typ,len(rows),cursor,flush=True)
                  d=pd.DataFrame(rows)
                  if d.empty:raise ValueError(f'empty {typ} history')
                  d.to_parquet(root/('funding.parquet' if typ=='funding' else 'perpetual_hourly.parquet'),index=False)
                  state[typ+'_rows']=len(d)
              state['status']='complete'
          except Exception as e:state.update(status='unavailable',reason=str(e));print(str(e),flush=True)
          finally:
              (root/'source_manifest.json').write_text(json.dumps(manifest,indent=2));(root/'status.json').write_text(json.dumps(state,indent=2))
              (root/'export_hashes.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge3-public-inverse-history
          path: inverse-history/
          retention-days: 30
