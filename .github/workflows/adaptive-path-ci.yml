name: Adaptive path research CI
on:
  push:
    branches: [research/adaptive-path-20260909]
    paths:
      - 'research/adaptive_path/**'
      - 'tests/test_ahe.py'
      - '.github/workflows/adaptive-path-ci.yml'
permissions:
  contents: read
jobs:
  test-ahe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_ahe.py
